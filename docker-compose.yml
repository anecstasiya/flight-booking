name: flight-booking

services:
  booking-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD:-booking_dev}
    volumes:
      - booking-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30

  flight-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flight
      POSTGRES_USER: flight
      POSTGRES_PASSWORD: ${FLIGHT_DB_PASSWORD:-flight_dev}
    volumes:
      - flight-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30

  flight-service:
    build:
      context: .
      dockerfile: flight-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://flight:${FLIGHT_DB_PASSWORD:-flight_dev}@flight-db:5432/flight
    depends_on:
      flight-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FLIGHT_GRPC_PORT:-50051}:50051"
    healthcheck:
      test: [CMD, python, -m, app.healthcheck]
      interval: 5s
      timeout: 4s
      retries: 15

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://booking:${BOOKING_DB_PASSWORD:-booking_dev}@booking-db:5432/booking
      FLIGHT_SERVICE_ADDRESS: flight-service:50051
    depends_on:
      booking-db:
        condition: service_healthy
      flight-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BOOKING_PORT:-8000}:8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 15

  tests:
    profiles: [test]
    build:
      context: .
      dockerfile: tests/Dockerfile
    environment:
      BOOKING_URL: http://booking-service:8000
      FLIGHT_SERVICE_ADDRESS: flight-service:50051
      TEST_BOOKING_DATABASE_URL: postgresql://booking:${BOOKING_DB_PASSWORD:-booking_dev}@booking-db:5432/booking
      TEST_FLIGHT_DATABASE_URL: postgresql://flight:${FLIGHT_DB_PASSWORD:-flight_dev}@flight-db:5432/flight
    depends_on:
      booking-service:
        condition: service_healthy
      flight-service:
        condition: service_healthy

volumes:
  booking-data:
  flight-data:
