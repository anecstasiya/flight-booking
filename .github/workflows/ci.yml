name: Check scaffold and migrations

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python
        run: |
          ruff check .
          ruff format --check .
          python -m compileall -q booking-service flight-service scripts
      - name: Start services and verify migrations
        run: sh scripts/check.sh
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down
